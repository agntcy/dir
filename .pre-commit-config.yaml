repos:
  - repo: local
    hooks:
      - id: golangci-lint
        name: golangci-lint
        description: |
          Same as golangci-lint's official hook, but works with multiple Go modules.
          https://github.com/golangci/golangci-lint/blob/main/.pre-commit-hooks.yaml
        entry: "task pre-commit:golangci-lint -- "
        language: system
        pass_filenames: true
        types: [go]
        # Avoid running alongside other hooks; golangci-lint uses a global lock.
        require_serial: true
      - id: gateway-ui-static
        name: Remind to rebuild gateway UI static assets
        description: |
          Warns when server/gateway/ui source is staged without regenerated
          server/gateway/static. Does not block the commit; CI Verify is the gate.
        entry: task pre-commit:gateway-ui
        language: system
        files: ^server/gateway/ui/
        pass_filenames: false
        verbose: true
