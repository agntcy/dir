version: "3"

tasks:
  default:
    cmd: echo "Run the main Taskfile instead of this one."

  # NOTE: Unlike cli:compile, this requires CGO and therefore a matching C
  # toolchain for the target GOOS/GOARCH. Cross-compiling to a different OS
  # (and often a different arch) does not work with just GOOS/GOARCH env vars
  # the way it does for the pure-Go dirctl build -- each platform's artifact
  # must be built on/for that platform (e.g. one native runner per OS/ARCH in
  # CI), not cross-compiled from a single host.
  wrapperlib:compile:
    desc: Compile the dir client-wrapper C-shared library for the host platform
    dir: ./wrapperlib
    vars:
      GOOS: "{{ .GOOS | default OS }}"
      GOARCH: "{{ .GOARCH | default ARCH }}"
      LIB_NAME: '{{ .LIB_NAME | default "libdirwrapper" }}'
      LIB_EXT: '{{ if eq .GOOS "windows" }}dll{{ else if eq .GOOS "darwin" }}dylib{{ else }}so{{ end }}'
      OUT_DIR: '{{ .OUT_DIR | default (print .ROOT_DIR "/.bin") }}'
      OUT_LIB: "{{ .OUT_DIR }}/{{ .LIB_NAME }}-{{ .GOOS }}-{{ .GOARCH }}.{{ .LIB_EXT }}"
    cmds:
      - mkdir -p "{{.OUT_DIR}}"
      - |
        CGO_ENABLED=1 GOOS={{.GOOS}} GOARCH={{.GOARCH}} go build \
          -buildmode=c-shared \
          -ldflags="-s -w" \
          -o "{{.OUT_LIB}}" .
