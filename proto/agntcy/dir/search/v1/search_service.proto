syntax = "proto3";

package agntcy.dir.search.v1;

import "agntcy/dir/core/v1/record.proto";
import "agntcy/dir/search/v1/record_query.proto";

// SortMode controls the ordering of search results.
enum SortMode {
  // SORT_MODE_UNSPECIFIED defaults to SORT_MODE_RECENCY.
  SORT_MODE_UNSPECIFIED = 0;

  // SORT_MODE_RECENCY orders results by creation time, newest first.
  SORT_MODE_RECENCY = 1;

  // SORT_MODE_POPULARITY orders results by pull count plus lookup count
  // (direct usage signal), highest first.
  SORT_MODE_POPULARITY = 2;

  // SORT_MODE_PROVIDER_COUNT orders results by the number of DHT peers
  // currently announcing the record (network distribution signal), highest first.
  SORT_MODE_PROVIDER_COUNT = 3;

  // SORT_MODE_RELEVANCE orders results by how many query signals matched the
  // record, highest first. Used with natural-language search fan-out queries.
  SORT_MODE_RELEVANCE = 4;
}

service SearchService {
  // Search for record CIDs that match the given parameters.
  // Returns only CIDs for efficient lookups and piping to other commands.
  // This operation does not interact with the network.
  rpc SearchCIDs(SearchCIDsRequest) returns (stream SearchCIDsResponse);

  // Search for full records that match the given parameters.
  // Returns complete record data including all metadata, skills, domains, etc.
  // This operation does not interact with the network.
  rpc SearchRecords(SearchRecordsRequest) returns (stream SearchRecordsResponse);

  // Count records that match the given parameters.
  // This operation does not interact with the network.
  rpc CountRecords(CountRecordsRequest) returns (CountRecordsResponse);

  // List the distinct values present in the registry for the given record fields.
  //
  // Intended for populating filter panels: every returned value is one that some
  // record actually carries, so a filter built from it can never yield an empty
  // result. Values are returned verbatim in the form a RecordQuery accepts, so
  // they can be fed straight back into SearchCIDs, SearchRecords, or CountRecords.
  //
  // Values are registry-wide; no query context is applied.
  // This operation does not interact with the network.
  rpc ListRecordValues(ListRecordValuesRequest) returns (ListRecordValuesResponse);
}

message SearchCIDsRequest {
  // List of queries to match against the records.
  repeated RecordQuery queries = 1;

  // Optional limit on the number of results to return.
  optional uint32 limit = 2;

  // Optional offset for pagination of results.
  optional uint32 offset = 3;

  // Sort mode for the results. Defaults to SORT_MODE_RECENCY.
  SortMode sort_mode = 4;
}

message SearchRecordsRequest {
  // List of queries to match against the records.
  repeated RecordQuery queries = 1;

  // Optional limit on the number of results to return.
  optional uint32 limit = 2;

  // Optional offset for pagination of results.
  optional uint32 offset = 3;

  // Sort mode for the results. Defaults to SORT_MODE_RECENCY.
  SortMode sort_mode = 4;
}

message CountRecordsRequest {
  // List of queries to match against the records.
  repeated RecordQuery queries = 1;
}

message SearchCIDsResponse {
  // The CID of the record that matches the search criteria.
  string record_cid = 1;
}

message SearchRecordsResponse {
  // The full record that matches the search criteria.
  agntcy.dir.core.v1.Record record = 1;
}

message CountRecordsResponse {
  // Total number of distinct records that match the search criteria.
  uint32 total_count = 1;
}

message ListRecordValuesRequest {
  // Which fields to return distinct values for. Empty returns every supported
  // field.
  //
  // Supported fields are RECORD_QUERY_TYPE_VERSION, RECORD_QUERY_TYPE_SKILL_NAME,
  // RECORD_QUERY_TYPE_MODULE_NAME, RECORD_QUERY_TYPE_DOMAIN_NAME, and
  // RECORD_QUERY_TYPE_SCHEMA_VERSION. Requesting any other type fails the call
  // rather than silently omitting it. The name variants are used instead of the
  // numeric *_ID types so that every value is a human-meaningful string.
  repeated RecordQueryType fields = 1;
}

message ListRecordValuesResponse {
  // The distinct values present for a single record field.
  message FieldValues {
    // The field these values belong to.
    RecordQueryType field = 1;

    // Distinct values present in the registry, sorted lexicographically.
    // Records that leave the field unset contribute no entry.
    repeated string values = 2;
  }

  // One entry per requested field, in the order the fields were requested.
  // When the request left fields empty, entries are ordered by ascending
  // RecordQueryType number.
  repeated FieldValues fields = 1;
}
