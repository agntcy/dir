# Reference daemon configuration for dirctl.
#
# To use PostgreSQL instead of SQLite, change database.type to "postgres"
# and configure the postgres section.
#
# Relative paths (e.g. "store", "dir.db") are resolved against the data
# directory (default: ~/.agntcy/dir/, override with --data-dir).
# Use absolute paths to pin a location regardless of --data-dir.
#
# Override any setting via environment variables with the prefix
# DIRECTORY_DAEMON_ followed by the uppercased, underscore-delimited path:
#   DIRECTORY_DAEMON_SERVER_LISTEN_ADDRESS
#   DIRECTORY_DAEMON_SERVER_ROUTING_LISTEN_ADDRESS
#   DIRECTORY_DAEMON_SERVER_ROUTING_BOOTSTRAP_PEERS  (comma-separated)
#   DIRECTORY_DAEMON_SERVER_ROUTING_DIRECTORY_API_ADDRESS
#   DIRECTORY_DAEMON_SERVER_ROUTING_DIRECTORY_OCI_ADDRESS
#   DIRECTORY_DAEMON_SERVER_DATABASE_POSTGRES_USERNAME
#   DIRECTORY_DAEMON_SERVER_DATABASE_POSTGRES_PASSWORD
#   DIRECTORY_DAEMON_SERVER_STORE_OCI_AUTH_CONFIG_USERNAME
#   DIRECTORY_DAEMON_SERVER_STORE_OCI_AUTH_CONFIG_PASSWORD
#   DIRECTORY_DAEMON_RECONCILER_LOCAL_REGISTRY_AUTH_CONFIG_USERNAME
#   DIRECTORY_DAEMON_RECONCILER_LOCAL_REGISTRY_AUTH_CONFIG_PASSWORD

server:
  listen_address: "localhost:8888"
  oasf_api_validation:
    schema_url: "https://schema.oasf.outshift.com"
  store:
    provider: "oci"
    oci:
      local_dir: "store" # relative to data-dir or can be absolute path like "/tmp/agntcy/dir/oci/"
      registry_address: "localhost:5555"
      repository_name: "dir"
      auth_config:
        insecure: true
      # To use a remote OCI registry, unset local_dir:
      #   registry_address: "ghcr.io"
      #   repository_name: "org/agents"
    verification:
      enabled: true
  routing:
    listen_address: "/ip4/0.0.0.0/tcp/8999"
    key_path: "node.key"
    datastore_dir: "routing"
    # bootstrap_peers:
    #   - "/dns4/remote-dir.example.com/tcp/8999/p2p/<peer-id>"

    # Endpoints advertised to peers so they can sync records from this node.
    # Both are optional; empty means the endpoint is not advertised. Set the
    # publicly reachable addresses here, which may differ from listen_address
    # and store.oci.registry_address.
    # directory_api_address: "dir.example.com:8888"
    # directory_oci_address: "ghcr.io/org/agents"

    # How often local CID provider announcements are republished. Lower values
    # let newly joined nodes converge on existing content sooner, at the cost of
    # more announcement traffic and more work for every subscriber.
    republish_interval: "36h"

    # Circuit-relay v2 for NAT traversal.
    # relay_service: enable a relay service on this node (only on publicly
    #   reachable nodes, e.g. bootstrap) so it can relay traffic for NAT'd peers.
    # static_relays: relays this node uses to obtain a circuit address under NAT.
    relay_service: false
    # static_relays:
    #   - "/dns4/relay.example.com/tcp/8999/p2p/<relay-peer-id>"
    # force_reachability_private: assume this node is behind NAT so AutoRelay
    #   proactively reserves a relay and advertises a circuit address (direct
    #   dials + hole punching are still preferred). Enable only on NAT'd nodes.
    force_reachability_private: false
    # force_reachability_public: assume this node is publicly reachable. REQUIRED
    #   on a relay node (relay_service: true) behind a cloud load balancer — the
    #   circuit-relay v2 hop service only starts when reachability is Public, and
    #   AutoNAT cannot self-confirm this behind an LB. Enable only on genuinely
    #   public nodes. Mutually exclusive with force_reachability_private.
    force_reachability_public: false
  database:
    type: "sqlite"
    sqlite:
      path: "dir.db"
    postgres:
      host: "localhost"
      port: 5432
      database: "dir"
      ssl_mode: "disable"
  publication:
    scheduler_interval: 5m
    worker_count: 1
    worker_timeout: 30m
  http_gateway:
    enabled: true
    listen_address: ":8889"
    public_url: "http://localhost:8889"
    # catalog_title: "AI Catalog"
  naming:
    ttl: 168h

reconciler:
  regsync:
    enabled: true
    interval: 1m
  metrics:
    enabled: true
    interval: 1m
  indexer:
    enabled: true
    interval: 1m
  signature:
    enabled: true
    interval: 1m
    ttl: 168h
    record_timeout: 30s
  name:
    enabled: true
    interval: 1m
    ttl: 168h
    record_timeout: 30s
  scan:
    enabled: true
    interval: 1m
    ttl: 168h
    record_timeout: 2m
    mcp_cli_path: "mcp-scanner"
    skill_cli_path: "skill-scanner"
    a2a_cli_path: "a2a-scanner"
    # The MCP scan has a second phase that connects to the live endpoints a
    # record declares. Turn it off where the reconciler must not make outbound
    # connections to third-party servers.
    disable_endpoint_scan: false
    # Endpoints on loopback, link-local, private, and other reserved ranges are
    # refused by default, because endpoint URLs come from published records.
    # Turn this on for self-hosted deployments where the directory and its MCP
    # servers share a private network.
    allow_private_endpoints: false
    # Permit plain http endpoints. Separate from allow_private_endpoints so
    # that reaching a private endpoint does not also allow cleartext scans of
    # public hosts.
    allow_insecure_transport: false
    # Bounds how many distinct endpoints one record can make the daemon dial.
    # Each endpoint costs one scanner invocation per subcommand, so an
    # unbounded list lets one published record fan out arbitrarily. 0 = default (8).
    max_endpoints_per_record: 8
  local_registry:
    registry_address: "localhost:5555"
    repository_name: "dir"
    auth_config:
      insecure: true
  database:
    type: "sqlite"
    sqlite:
      path: "dir.db"

runtime:
  enabled: false

  adapter:
    type: "docker"
    docker:
      host: "unix:///var/run/docker.sock"
    kubernetes:
      kubeconfig: "~/.kube/config"

  resolver:
    a2a:
      enabled: true
    oasf:
      enabled: true
      ## Optional custom configuration for the DIR client used by the OASF resolver.
      ## If not set, the resolver will use the default configuration which sources
      ## from environment variables.
      # client:
      #   server_address: "https://custom-dir-api.com"
      #   auth_mode: "oidc"
      #   auth_token: "<token>"

  store:
    type: "sqlite"
