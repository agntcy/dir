name: Post Release
on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  prepare:
    if: startsWith(github.event.release.tag_name, 'v')
    name: Prepare
    runs-on: ubuntu-latest
    outputs:
      modules: ${{ steps.modules.outputs.modules }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Get server modules
        id: modules
        run: |
          echo 'modules=["cli","tests","server","reconciler"]' >> "$GITHUB_OUTPUT"

  create-module-tags:
    needs: prepare
    name: Create module tags
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      matrix:
        tags: ${{ fromJson(needs.prepare.outputs.modules) }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Create tags
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            github.rest.git.createRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: 'refs/tags/${{ matrix.tags }}/${{ github.ref_name }}',
              sha: context.sha
            })

  winget:
    name: WinGet
    # Stable releases only. The release is published by now, so the Windows zip
    # has a public URL to hash.
    if: startsWith(github.event.release.tag_name, 'v') && !github.event.release.prerelease
    uses: ./.github/workflows/reusable-winget.yaml
    with:
      release_tag: ${{ github.event.release.tag_name }}
      publish: true
    secrets:
      PROJECT_APP_ID: ${{ secrets.PROJECT_APP_ID }}
      PROJECT_APP_KEY: ${{ secrets.PROJECT_APP_KEY }}
