name: daemon-external

services:
  zot:
    image: ghcr.io/project-zot/zot:v2.1.22
    ports:
      - "25555:5000"
    deploy:
      restart_policy:
        condition: on-failure

  postgres:
    image: docker.io/bitnami/postgresql:latest@sha256:e2815ea79b38b77696bb189605a1f2e95a0bd3f70d419385500fc03d20d23c37
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: directory
    ports:
      - "25432:5432"
    deploy:
      restart_policy:
        condition: on-failure
    healthcheck:
      test: pg_isready -U postgres -d directory || exit 1
      interval: 5s
      retries: 30
      start_period: 5s

  # Service used for runtime discovery.
  #
  # Held behind a profile so `docker compose up` does not start it with the
  # rest of the stack. The daemon's OASF resolver gives each workload a bounded
  # retry budget and never re-queues one whose budget ran out, so a workload
  # that exists before its record does is unrecoverable. Starting this only
  # after the record has been pushed makes the docker start event the trigger,
  # with the record already in the store. Started by startRuntimeWorkload in
  # tests/e2e/daemon/01_daemon_test.go. See issue #1780.
  service-a2a:
    profiles: ["runtime-discovery"]
    image: nginx:latest@sha256:f9ea18bfa4fad859e1ed38259d711da7ccad2c3516e875cec3351a57c859f571
    labels:
      - "test.org.agntcy/discover=true"
      - "test.org.agntcy/agent-type=a2a"
      # Reference to the sample record for runtime discovery
      - "test.org.agntcy/agent-record=baeareiabbog2umgduqhlcb64fzt6adn34kblzvru\
        3fdzkl75hjhwt6h3da"
    volumes:
      - ./workload.a2a-card.json:/usr/share/nginx/html/.well-known/agent-card.json
    ports:
      - 80
