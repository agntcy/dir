apiserver:
  service:
    type: "NodePort"
    nodePort: "30088"
    metricsNodePort: "30090"

  config:
    publication:
      scheduler_interval: "1s"
    routing:
      refresh_interval: "1s"
    ratelimit:
      enabled: "true"
      global_rps: "100"
      global_burst: "200"
      per_client_rps: "100"
      per_client_burst: "200"

  reconciler:
    config:
      regsync:
        interval: "10s"
      indexer:
        interval: "10s"
      name:
        interval: "5s"
      signature:
        interval: "5s"

  httpGateway:
    enabled: true
    port: 8889
    service:
      type: NodePort
      nodePort: 30889

  # OASF-SDK extractor server: exercises the gateway's natural-language search
  # (POST /v1/search) over the remote-extractor path. By design the oasf-sdk pod
  # downloads the embedding model from HuggingFace at startup, so this env needs
  # egress to huggingface.co and will not come up behind a TLS-intercepting proxy.
  oasf-sdk:
    enabled: true
