name: dir-integration-tests-for-server
services:
  zot:
    image: ghcr.io/project-zot/zot:v2.1.22
    ports:
      - 5556:5000
    deploy:
      mode: replicated
      replicas: 1
      restart_policy:
        condition: on-failure
  postgres:
    image: docker.io/bitnami/postgresql:latest@sha256:9834b9d958f73a6c79457af08ebdbb8651fcb51e5efbad22b96636637316c26e
    environment:
      POSTGRES_USER: ditfs_user
      POSTGRES_PASSWORD: ditfs_pass
      POSTGRES_DB: ditfs_db
    ports:
      - 5433:5432
    deploy:
      mode: replicated
      replicas: 1
      restart_policy:
        condition: on-failure
    healthcheck:
      test: pg_isready -U ditfs_user -d ditfs_pass || exit 1
      interval: 10s
      retries: 60
      start_period: 10s
  oasf:
    # Pin to the released 1.0.0 schema image.
    image: ghcr.io/agntcy/oasf-server:v1.0.4
    ports:
      - 8092:8080
    deploy:
      mode: replicated
      replicas: 1
      restart_policy:
        condition: on-failure
networks:
  default:
    name: dir-integration-tests-for-server-network
