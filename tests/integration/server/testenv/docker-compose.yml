name: dir-integration-tests-for-server
services:
  zot:
    image: ghcr.io/project-zot/zot:v2.1.22
    ports:
      - 5556:5000
    deploy:
      mode: replicated
      replicas: 1
      restart_policy:
        condition: on-failure
  postgres:
    image: docker.io/bitnami/postgresql:latest@sha256:889db6427034525f50071945ddf808fbb77f8a52c2c8d3a7a75d39a167373566
    environment:
      POSTGRES_USER: ditfs_user
      POSTGRES_PASSWORD: ditfs_pass
      POSTGRES_DB: ditfs_db
    ports:
      - 5433:5432
    deploy:
      mode: replicated
      replicas: 1
      restart_policy:
        condition: on-failure
    healthcheck:
      test: pg_isready -U ditfs_user -d ditfs_pass || exit 1
      interval: 10s
      retries: 60
      start_period: 10s
  # Docker fills the empty oasf-schema volume with the image's /schema, then the
  # container exits. The server serves the volume as its schema.
  oasf-schema:
    image: ghcr.io/agntcy/oasf-schema:1.0.0
    command: ["true"]
    volumes:
      - oasf-schema:/schema
  oasf:
    image: ghcr.io/agntcy/oasf-server:v2.0.0
    depends_on:
      oasf-schema:
        condition: service_completed_successfully
    volumes:
      - oasf-schema:/app/schema:ro
    ports:
      - 8092:8080
    deploy:
      mode: replicated
      replicas: 1
      restart_policy:
        condition: on-failure
volumes:
  oasf-schema:
networks:
  default:
    name: dir-integration-tests-for-server-network
