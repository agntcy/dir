version: "3"

tasks:
  default:
    cmd: echo "Run the main Taskfile instead of this one."

  ui:build:
    desc: Build the gateway UI (SvelteKit static output)
    dir: ./server/gateway/ui
    cmds:
      # Wipe hashed output so a rebuild replaces chunks instead of leaving stale files tracked.
      - find ../static -mindepth 1 -maxdepth 1 -exec rm -rf {} +
      - npm ci
      - npm run build

  ui:dev:
    desc: Start the gateway UI dev server with HMR
    dir: ./server/gateway/ui
    cmds:
      - npm run dev

  ui:test:
    desc: Run the gateway UI unit tests
    dir: ./server/gateway/ui
    cmds:
      - npm ci
      - npm test
