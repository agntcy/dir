[request_definition]
r = trust_domain, spiffe_id, api_method

[policy_definition]
p = subject, api_method

[policy_effect]
e = some(where (p.eft == allow))

# A subject starting with spiffe:// names callers by SPIFFE ID, exactly or by a
# prefix ending in *; any other subject names a trust domain. Only a rule
# naming SPIFFE IDs grants an identity-only method.
[matchers]
m = (keyMatch(r.api_method, p.api_method) || regexMatch(r.api_method, p.api_method)) && \
    ((isSpiffeID(p.subject) && keyMatch(r.spiffe_id, p.subject)) || \
     (!isSpiffeID(p.subject) && !identityOnly(r.api_method) && \
      (keyMatch(r.trust_domain, p.subject) || regexMatch(r.trust_domain, p.subject))))
